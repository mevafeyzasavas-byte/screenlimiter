name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android lisanslari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk app.apk
          gh release create "run-${{ github.run_id }}" app.apk --title "APK ${{ github.run_number }}" --notes "otomatik" --target "${{ github.sha }}"
          gh release list --limit 100 --json tagName -q '.[].tagName | select(startswith("run-"))' | tail -n +6 | xargs -r -I{} gh release delete {} --cleanup-tag -y
